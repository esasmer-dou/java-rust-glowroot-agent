name: Optional adapter build contracts
description: Install pinned Dubbo and cache Java contracts without adding them to the core runtime.
runs:
  using: composite
  steps:
    - name: Check out the pinned public Java surface
      uses: actions/checkout@v5
      with:
        repository: esasmer-dou/java-rust-dubbo-spring-boot
        ref: 4adec86e99f3c52ca0413cf14f52349d8489809e
        path: .native-dubbo-build-contract
        persist-credentials: false
    - name: Install only the annotations and runtime build contract
      shell: bash
      run: >-
        mvn -B -ntp -f "$GITHUB_WORKSPACE/.native-dubbo-build-contract/pom.xml"
        -pl java-rust-dubbo-runtime -am install -DskipTests
    - name: Check out the published cache contract POM
      uses: actions/checkout@v5
      with:
        repository: esasmer-dou/java-rust-cache
        ref: 4a496db9a8f0d3e4551a264c0a921e583a2ed82c
        path: .cache-build-contract
        persist-credentials: false
    - name: Install the checksum-pinned published cache contract
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download v0.8.0 --repo esasmer-dou/java-rust-cache \
          --pattern java-rust-cache-0.8.0.jar --dir "$GITHUB_WORKSPACE/.cache-build-contract"
        cd "$GITHUB_WORKSPACE/.cache-build-contract"
        echo '0235971f3ff3a272ec575b4f7980cb419adc3ab7c149a663f00998fcc70606ba  java-rust-cache-0.8.0.jar' | sha256sum -c -
        mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
          -Dfile=java-rust-cache-0.8.0.jar -DpomFile=pom.xml
