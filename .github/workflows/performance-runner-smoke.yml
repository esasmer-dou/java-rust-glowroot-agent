name: Performance Runner Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-rust-glowroot-performance-runner
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, reactor-wsl-smoke, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Semeru OpenJ9 21
        uses: actions/setup-java@v5
        with:
          distribution: semeru
          java-version: "21"

      - name: Verify runner toolchain and isolation prerequisites
        shell: pwsh
        run: |
          $dockerCpu = [int] (docker info --format '{{.NCPU}}')
          $dockerMemory = [int64] (docker info --format '{{.MemTotal}}')
          if ($dockerCpu -lt 8 -or $dockerMemory -lt 12GB) {
            throw "Runner capacity is below the production gate floor: CPUs=$dockerCpu memoryBytes=$dockerMemory"
          }
          docker version
          java -version
          mvn -version
          ./benchmark/test_gate_statistics.ps1
          ./benchmark/test_warmup_statistics.ps1

      - name: Record WSL smoke runner classification
        shell: pwsh
        run: |
          ./benchmark/performance_runner_preflight.ps1 `
            -RunnerClass reactor-wsl-smoke `
            -AllowWslForSmoke `
            -EvidencePath benchmark/results/runner-preflight/wsl-smoke.json

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-runner-smoke
          path: benchmark/results/runner-preflight/wsl-smoke.json
          if-no-files-found: error
          retention-days: 7
