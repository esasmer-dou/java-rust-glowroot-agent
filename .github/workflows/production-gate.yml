name: Production Gate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REACTOR_PERFORMANCE_RUNNER_CLASS: reactor-performance-native-linux

concurrency:
  group: java-rust-glowroot-production-performance
  cancel-in-progress: false

jobs:
  gate-statistics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Semeru OpenJ9 21
        uses: actions/setup-java@v5
        with:
          distribution: semeru
          java-version: "21"
          cache: maven

      - name: Verify benchmark decision statistics
        shell: pwsh
        run: |
          ./benchmark/test_gate_statistics.ps1
          ./benchmark/test_warmup_statistics.ps1
          ./benchmark/test_benchmark_isolation.ps1

      - name: Build exact-commit Java artifacts
        run: mvn -B -ntp clean install

      - name: Verify Spring Boot non-web integration
        shell: pwsh
        run: ./benchmark/non_web_gate.ps1 -SkipAgentBuild

  spring-boot-agent:
    needs: gate-statistics
    runs-on: [self-hosted, reactor-performance-native-linux, linux, x64]
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check out pinned Glowroot wire contract
        uses: actions/checkout@v5
        with:
          repository: glowroot/glowroot
          ref: 622dc6f800228cccc6fa37b0ed9e779446d7c41e
          path: glowroot-upstream

      - name: Set up Semeru OpenJ9 21
        uses: actions/setup-java@v5
        with:
          distribution: semeru
          java-version: "21"

      - name: Verify dedicated native Linux runner
        shell: pwsh
        run: |
          ./benchmark/performance_runner_preflight.ps1 `
            -RunnerClass $env:REACTOR_PERFORMANCE_RUNNER_CLASS `
            -EvidencePath benchmark/results/runner-preflight/spring-boot-agent.json

      - name: Run full paired Spring Boot matrix
        shell: pwsh
        run: |
          ./benchmark/spring_boot_gate.ps1 `
            -PairRepeats 6 `
            -ConcurrencyLevels "64,256" `
            -EndpointClasses "small-json,raw-json,heavy-json" `
            -Duration "15s" `
            -Warmup "8s" `
            -MinWarmupRounds 3 `
            -MaxWarmupRounds 16 `
            -MaxWarmupConfirmationRounds 8 `
            -MaxWarmupRobustTrendPercent 3 `
            -MaxWarmupBorderlineRobustTrendPercent 5 `
            -MaxWarmupBorderlineMedianShiftPercent 3 `
            -MaxWarmupMedianAbsoluteDeviationPercent 4 `
            -MaxNon2xxDeltaPercentagePoints 0 `
            -MaxSaturatedNon2xxDeltaPercentagePoints 0.02 `
            -MaxAbsoluteNon2xxPercent 0.05 `
            -AutoSelectCpuRoles `
            -FailOnGate

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-production-gate
          path: |
            benchmark/results/spring_gate_*/
            benchmark/results/runner-preflight/spring-boot-agent.json
          if-no-files-found: error
          retention-days: 30

  rust-java-rest-agent:
    needs: gate-statistics
    runs-on: [self-hosted, reactor-performance-native-linux, linux, x64]
    timeout-minutes: 180
    steps:
      - name: Check out agent source
        uses: actions/checkout@v5
        with:
          path: java-rust-glowroot-agent

      - name: Check out production Rust-Java REST runtime
        uses: actions/checkout@v5
        with:
          repository: esasmer-dou/rust-java-rest
          ref: v4.5.0
          path: rust-java-rest

      - name: Check out pinned Glowroot wire contract
        uses: actions/checkout@v5
        with:
          repository: glowroot/glowroot
          ref: 622dc6f800228cccc6fa37b0ed9e779446d7c41e
          path: glowroot

      - name: Set up Semeru OpenJ9 21
        uses: actions/setup-java@v5
        with:
          distribution: semeru
          java-version: "21"

      - name: Verify dedicated native Linux runner
        shell: pwsh
        working-directory: java-rust-glowroot-agent
        run: |
          ./benchmark/performance_runner_preflight.ps1 `
            -RunnerClass $env:REACTOR_PERFORMANCE_RUNNER_CLASS `
            -EvidencePath benchmark/results/runner-preflight/rust-java-rest-agent.json

      - name: Run full paired Rust-Java REST matrix
        shell: pwsh
        working-directory: java-rust-glowroot-agent
        run: |
          ./benchmark/spring_boot_gate.ps1 `
            -ApplicationKind rust-java-rest `
            -RequiredRestVersion "4.5.0" `
            -RequiredRestNativeAbi 29 `
            -PairRepeats 6 `
            -ConcurrencyLevels "64,256" `
            -EndpointClasses "small-json,raw-json,heavy-json" `
            -Duration "15s" `
            -Warmup "8s" `
            -MinWarmupRounds 3 `
            -MaxWarmupRounds 16 `
            -MaxWarmupConfirmationRounds 8 `
            -MaxWarmupRobustTrendPercent 3 `
            -MaxWarmupBorderlineRobustTrendPercent 5 `
            -MaxWarmupBorderlineMedianShiftPercent 3 `
            -MaxWarmupMedianAbsoluteDeviationPercent 4 `
            -MaxNon2xxDeltaPercentagePoints 0 `
            -MaxSaturatedNon2xxDeltaPercentagePoints 0.02 `
            -MaxAbsoluteNon2xxPercent 0.05 `
            -MemoryLimit "128m" `
            -AllowedThreadDelta 1 `
            -AutoSelectCpuRoles `
            -FailOnGate

      - name: Run Rust-Java REST protocol and fail-open gate
        shell: pwsh
        working-directory: java-rust-glowroot-agent
        run: |
          ./benchmark/glowroot_gate.ps1 `
            -ProtocolOnly `
            -SkipBuild `
            -AutoSelectCpuRoles `
            -FailOnGate

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-java-rest-production-gate
          path: |
            java-rust-glowroot-agent/benchmark/results/rest_gate_*/
            java-rust-glowroot-agent/benchmark/results/glowroot_gate_*/
            java-rust-glowroot-agent/benchmark/results/runner-preflight/rust-java-rest-agent.json
          if-no-files-found: error
          retention-days: 30
