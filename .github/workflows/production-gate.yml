name: Production Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spring-boot-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check out pinned Glowroot wire contract
        uses: actions/checkout@v5
        with:
          repository: glowroot/glowroot
          ref: 622dc6f800228cccc6fa37b0ed9e779446d7c41e
          path: glowroot-upstream

      - name: Set up Semeru OpenJ9 21
        uses: actions/setup-java@v5
        with:
          distribution: semeru
          java-version: "21"
          cache: maven

      - name: Run full paired Spring Boot matrix
        shell: pwsh
        run: |
          ./benchmark/spring_boot_gate.ps1 `
            -PairRepeats 6 `
            -ConcurrencyLevels "64,256" `
            -EndpointClasses "small-json,raw-json,heavy-json" `
            -Duration "15s" `
            -Warmup "8s" `
            -AutoSelectCpuRoles `
            -AllowRunnerCollectorSiblingSharing `
            -FailOnGate

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-production-gate
          path: benchmark/results/spring_gate_*/
          if-no-files-found: warn
          retention-days: 30
