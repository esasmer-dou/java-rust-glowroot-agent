name: Production Runner Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-rust-glowroot-production-performance
  cancel-in-progress: false

jobs:
  native-linux:
    runs-on: [self-hosted, reactor-performance-native-linux, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Semeru OpenJ9 21
        uses: actions/setup-java@v5
        with:
          distribution: semeru
          java-version: "21"

      - name: Verify native Linux host and toolchain
        shell: pwsh
        run: |
          ./benchmark/performance_runner_preflight.ps1 `
            -RunnerClass reactor-performance-native-linux `
            -EvidencePath benchmark/results/runner-preflight/native-linux.json
          ./benchmark/test_gate_statistics.ps1
          ./benchmark/test_warmup_statistics.ps1

      - name: Verify Docker execution
        shell: bash
        run: |
          docker run --rm alpine:3.21 sh -c 'test "$(uname -s)" = Linux'

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-runner-preflight
          path: benchmark/results/runner-preflight/native-linux.json
          if-no-files-found: error
          retention-days: 7
