name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.5.0"
        required: true
        type: string
      repair_partial_package:
        description: "Delete and republish incomplete GitHub Packages versions"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve release version
        id: requested_version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check out the requested release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          git fetch --force --tags
          git checkout --detach "v${{ steps.requested_version.outputs.version }}"

      - name: Require exact-commit Production Gate evidence
        id: production_gate
        shell: pwsh
        env:
          PRODUCTION_GATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseCommit = (git rev-parse HEAD).Trim()
          ./scripts/verify-production-gate.ps1 `
            -Repository $env:GITHUB_REPOSITORY `
            -Commit $releaseCommit `
            -GitHubOutputPath $env:GITHUB_OUTPUT

      - name: Verify managed Linux Production Gate runners
        shell: bash
        run: |
          RUN_ID="${{ steps.production_gate.outputs.production_gate_run_id }}"
          JOBS_JSON="${RUNNER_TEMP}/production-gate-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > "$JOBS_JSON"
          jq -e '
            [.jobs[] | select(.name == "spring-boot-agent" or .name == "rust-java-rest-agent")] as $gates |
            ($gates | length) == 2 and
            all($gates[];
              .conclusion == "success" and
              (.labels | index("ubuntu-24.04")) != null and
              (.labels | index("self-hosted")) == null and
              (.runner_name | startswith("GitHub Actions ")))
          ' "$JOBS_JSON" >/dev/null

      - name: Set up Semeru OpenJ9 21 and Maven publishing
        uses: actions/setup-java@v5
        with:
          distribution: semeru
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify release metadata
        id: release_metadata
        shell: bash
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test "$VERSION" = "${{ steps.requested_version.outputs.version }}"
          NOTES="docs/releases/${VERSION}.md"
          test -s "$NOTES"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Verify native provenance
        shell: bash
        run: |
          MANIFEST="spring-runtime-core/src/main/resources/native/native-provenance.properties"
          grep -qx 'schema=1' "$MANIFEST"
          grep -qx 'glowroot.abi=6' "$MANIFEST"
          grep -qx 'linux-x64.glibc-minimum=2.17' "$MANIFEST"
          grep -Eq '^source.revision=[0-9a-f]{40}$' "$MANIFEST"
          WINDOWS_EXPECTED="$(sed -n 's/^windows-x64.sha256=//p' "$MANIFEST")"
          LINUX_EXPECTED="$(sed -n 's/^linux-x64.sha256=//p' "$MANIFEST")"
          test "$(sha256sum spring-runtime-core/src/main/resources/native/windows-x64/rust_glowroot_agent.dll | awk '{print $1}')" = "$WINDOWS_EXPECTED"
          test "$(sha256sum spring-runtime-core/src/main/resources/native/linux-x64/librust_glowroot_agent.so | awk '{print $1}')" = "$LINUX_EXPECTED"
          bash scripts/verify-linux-native-compatibility.sh \
            spring-runtime-core/src/main/resources/native/linux-x64/librust_glowroot_agent.so \
            2.17

      - name: Download and validate Production Gate evidence
        shell: bash
        run: |
          RUN_ID="${{ steps.production_gate.outputs.production_gate_run_id }}"
          SPRING_GATE_DIR="${RUNNER_TEMP}/java-rust-glowroot-spring-gate"
          REST_GATE_DIR="${RUNNER_TEMP}/java-rust-glowroot-rest-gate"
          mkdir -p "$SPRING_GATE_DIR" "$REST_GATE_DIR"
          gh run download "$RUN_ID" \
            --name spring-boot-production-gate \
            --dir "$SPRING_GATE_DIR"
          gh run download "$RUN_ID" \
            --name rust-java-rest-production-gate \
            --dir "$REST_GATE_DIR"

          SPRING_REPORT="$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/REPORT.md' -type f -print -quit)"
          SPRING_SUMMARY="$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/summary.json' -type f -print -quit)"
          SPRING_STEADY="$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/steady-memory.json' -type f -print -quit)"
          SPRING_WARMUP="$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/warmup.json' -type f -print -quit)"
          SPRING_INVALID_PAIRS="$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/invalid-pair-attempts.json' -type f -print -quit)"
          SPRING_RUNNER="$(find "$SPRING_GATE_DIR" -path '*/runner-preflight/spring-boot-agent.json' -type f -print -quit)"
          REST_REPORT="$(find "$REST_GATE_DIR" -path '*/rest_gate_*/REPORT.md' -type f -print -quit)"
          REST_SUMMARY="$(find "$REST_GATE_DIR" -path '*/rest_gate_*/summary.json' -type f -print -quit)"
          REST_STEADY="$(find "$REST_GATE_DIR" -path '*/rest_gate_*/steady-memory.json' -type f -print -quit)"
          REST_WARMUP="$(find "$REST_GATE_DIR" -path '*/rest_gate_*/warmup.json' -type f -print -quit)"
          REST_RUNNER="$(find "$REST_GATE_DIR" -path '*/runner-preflight/rust-java-rest-agent.json' -type f -print -quit)"
          REST_PROTOCOL_REPORT="$(find "$REST_GATE_DIR" -path '*/glowroot_gate_*/REPORT.md' -type f -print -quit)"
          REST_PROTOCOL_SUMMARY="$(find "$REST_GATE_DIR" -path '*/glowroot_gate_*/gate-summary.json' -type f -print -quit)"
          REST_RUNTIME_IDENTITY="$(find "$REST_GATE_DIR" -name 'runtime-evidence-identity.json' -type f -print -quit)"
          for FILE in "$SPRING_REPORT" "$SPRING_SUMMARY" "$SPRING_STEADY" "$SPRING_WARMUP" \
            "$SPRING_INVALID_PAIRS" "$SPRING_RUNNER" "$REST_REPORT" "$REST_SUMMARY" \
            "$REST_STEADY" "$REST_WARMUP" "$REST_RUNNER" "$REST_PROTOCOL_REPORT" \
            "$REST_PROTOCOL_SUMMARY" "$REST_RUNTIME_IDENTITY"; do
            test -s "$FILE"
          done

          CURRENT_COMMIT="$(git rev-parse HEAD)"
          jq -e --arg current "$CURRENT_COMMIT" '.schema == 1 and .passed == true and
            .current_commit == $current and
            .required_rest_version == "4.6.2" and .required_rest_native_abi == 29 and
            (.evidence_commit | type == "string" and length == 40) and
            (.evidence_run_id | type == "string" and length > 0) and
            (.runtime_objects | length) == 4 and
            all(.runtime_objects[]; .matches == true and
              (.current_object | type == "string" and length == 40) and
              .current_object == .evidence_object)' "$REST_RUNTIME_IDENTITY" >/dev/null

          for RUNNER_EVIDENCE in "$SPRING_RUNNER" "$REST_RUNNER"; do
            jq -e '.schema == 1 and .passed == true and
              .runner_class == "github-hosted-linux" and
              .runner_environment == "github-hosted" and
              (.image_os | startswith("ubuntu")) and
              .wsl == false and .containerized == false and
              .logical_cpu >= 4 and .physical_cpu_groups >= 4 and
              .host_memory_gib >= 12 and .docker_cpu >= 4 and .docker_memory_gib >= 12 and
              all(.checks[]; .passed == true)' \
              "$RUNNER_EVIDENCE" >/dev/null
          done

          jq -e '.passed == true and .benchmark_classification == "production" and
            .release_evidence == true and .application_kind == "spring-boot" and
            .pair_repeats >= 3 and
            .pair_attempts == (.pair_repeats + .invalid_pair_attempts) and
            .invalid_pair_attempts <= 2 and .maximum_invalid_pair_attempts == 2 and
            .invalid_pair_policy == "discard_entire_pair_and_restart_both_variants" and
            .minimum_pair_repeats == 3 and .maximum_pair_repeats == 6 and
            ((.pair_repeats < 6 and .pair_decision == "strict_early_pass") or
              (.pair_repeats == 6 and .pair_decision == "maximum_pairs")) and
            .non_2xx_decision == "endpoint_noninferiority_median_weighted_aggregate_and_peak_envelope" and
            .non_2xx_threshold_percentage_points == 0 and
            .saturated_non_2xx_threshold_percentage_points == 0.02 and
            .absolute_non_2xx_ceiling_percent == 0.05 and
            .warmup_stability.prewarm_cycles == 4 and
            .warmup_stability.load_runner_lifecycle == "persistent_per_gate" and
            .warmup_stability.fixed_rounds == 6 and
            .warmup_stability.interleaved_rounds == 6 and
            .cpu_roles.auto_selected == true and
            .cpu_roles.selection_source == "automatic-idle-sample" and
            (.cpu_roles.application_slot_a | type == "string" and length > 0) and
            .cpu_roles.application_slot_b == .cpu_roles.application_slot_a and
            .cpu_roles.application_execution_slot_a == .cpu_roles.application_slot_a and
            .cpu_roles.application_execution_slot_b == .cpu_roles.application_slot_a and
            .cpu_roles.single_cpu_logical_pin == false and
            (.cpu_roles.runner | type == "string" and length > 0) and
            (.cpu_roles.collector | type == "string" and length > 0) and
            (.cpu_roles.orchestrator | type == "string" and length > 0) and
            .cpu_roles.variant_execution == "sequential_shared_slot" and
            .cpu_roles.runner_collector_sibling_sharing == false and
            .warmup_stability.maximum_confirmation_rounds == 14 and
            .warmup_stability.confirmation_scope == "all_endpoints_interleaved_per_variant" and
            .warmup_stability.observed_maximum_confirmation_rounds <= 14 and
            .warmup_stability.observed_maximum_total_rounds <= 20 and
            .warmup_stability.variant_interleaved == false and
            .warmup_stability.gate_mode == "absolute_rps_per_variant" and
            .warmup_stability.stability_window_rounds == 3 and
            .warmup_stability.maximum_allowed_robust_trend_pct == 3 and
            .warmup_stability.maximum_allowed_borderline_robust_trend_pct == 5 and
            .warmup_stability.maximum_allowed_borderline_median_shift_pct == 3 and
            .warmup_stability.maximum_allowed_median_absolute_deviation_pct == 4 and
            .warmup_stability.gate == "PASS" and
            .steady_memory.normalization == "explicit_full_gc_then_idle" and
            .steady_memory.gate == "PASS" and
            .measured_endpoint_classes == ["small-json", "raw-json"] and
            (.smoked_endpoint_classes | sort) == ["heavy-json", "raw-json", "small-json"] and
            (.rows | length) == 4 and all(.rows[]; .gate == "PASS" and
              .non_2xx_delta_pp <= .non_2xx_delta_threshold_pp and
              .aggregate_non_2xx_delta_pp <= .non_2xx_delta_threshold_pp and
              (.candidate_peak_non_2xx_pct - .baseline_peak_non_2xx_pct) <= .non_2xx_delta_threshold_pp and
              .baseline_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .candidate_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .baseline_peak_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .candidate_peak_non_2xx_pct <= .absolute_non_2xx_ceiling_pct)' \
            "$SPRING_SUMMARY" >/dev/null

          jq -e '.passed == true and .benchmark_classification == "production" and
            .release_evidence == true and .application_kind == "rust-java-rest" and
            .required_rest_version == "4.6.2" and .required_rest_native_abi == 29 and
            .activation_mode == "embedded_native_properties" and .pair_repeats >= 3 and
            .pair_attempts == (.pair_repeats + .invalid_pair_attempts) and
            .invalid_pair_attempts <= 2 and .maximum_invalid_pair_attempts == 2 and
            .invalid_pair_policy == "discard_entire_pair_and_restart_both_variants" and
            .minimum_pair_repeats == 3 and .maximum_pair_repeats == 6 and
            ((.pair_repeats < 6 and .pair_decision == "strict_early_pass") or
              (.pair_repeats == 6 and .pair_decision == "maximum_pairs")) and
            .non_2xx_decision == "endpoint_noninferiority_median_weighted_aggregate_and_peak_envelope" and
            .non_2xx_threshold_percentage_points == 0 and
            .saturated_non_2xx_threshold_percentage_points == 0.02 and
            .absolute_non_2xx_ceiling_percent == 0.05 and
            .warmup_stability.prewarm_cycles == 4 and
            .warmup_stability.load_runner_lifecycle == "persistent_per_gate" and
            .warmup_stability.fixed_rounds == 6 and
            .warmup_stability.interleaved_rounds == 6 and
            .cpu_roles.auto_selected == true and
            .cpu_roles.selection_source == "automatic-idle-sample" and
            (.cpu_roles.application_slot_a | type == "string" and length > 0) and
            .cpu_roles.application_slot_b == .cpu_roles.application_slot_a and
            .cpu_roles.application_execution_slot_a == .cpu_roles.application_slot_a and
            .cpu_roles.application_execution_slot_b == .cpu_roles.application_slot_a and
            .cpu_roles.single_cpu_logical_pin == false and
            (.cpu_roles.runner | type == "string" and length > 0) and
            (.cpu_roles.collector | type == "string" and length > 0) and
            (.cpu_roles.orchestrator | type == "string" and length > 0) and
            .cpu_roles.variant_execution == "sequential_shared_slot" and
            .cpu_roles.runner_collector_sibling_sharing == false and
            .warmup_stability.maximum_confirmation_rounds == 14 and
            .warmup_stability.confirmation_scope == "all_endpoints_interleaved_per_variant" and
            .warmup_stability.observed_maximum_confirmation_rounds <= 14 and
            .warmup_stability.observed_maximum_total_rounds <= 20 and
            .warmup_stability.variant_interleaved == false and
            .warmup_stability.gate_mode == "absolute_rps_per_variant" and
            .warmup_stability.stability_window_rounds == 3 and
            .warmup_stability.maximum_allowed_robust_trend_pct == 3 and
            .warmup_stability.maximum_allowed_borderline_robust_trend_pct == 5 and
            .warmup_stability.maximum_allowed_borderline_median_shift_pct == 3 and
            .warmup_stability.maximum_allowed_median_absolute_deviation_pct == 4 and
            .warmup_stability.gate == "PASS" and
            .steady_memory.normalization == "idle_window" and
            .steady_memory.gate == "PASS" and
            .measured_endpoint_classes == ["small-json", "raw-json"] and
            (.smoked_endpoint_classes | sort) == ["heavy-json", "raw-json", "small-json"] and
            (.rows | length) == 4 and all(.rows[]; .gate == "PASS" and
              .non_2xx_delta_pp <= .non_2xx_delta_threshold_pp and
              .aggregate_non_2xx_delta_pp <= .non_2xx_delta_threshold_pp and
              (.candidate_peak_non_2xx_pct - .baseline_peak_non_2xx_pct) <= .non_2xx_delta_threshold_pp and
              .baseline_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .candidate_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .baseline_peak_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .candidate_peak_non_2xx_pct <= .absolute_non_2xx_ceiling_pct)' \
            "$REST_SUMMARY" >/dev/null

          jq -e '.passed == true and .protocol_gate == "PASS" and
            .fail_open_gate == "PASS" and .javaagent_bootstrap_gate == "PASS" and
            .fail_open_observation.attempts >= 1 and
            .fail_open_observation.export_failure >= 1 and
            .fail_open_observation.deadline_ms == 75000 and
            .fail_open_observation.export_interval_contract_ms == 60000 and
            .fail_open_observation.elapsed_ms <= .fail_open_observation.deadline_ms' \
            "$REST_PROTOCOL_SUMMARY" >/dev/null

      - name: Remove incomplete Maven package versions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_partial_package }}
        shell: bash
        run: |
          VERSION="${{ steps.release_metadata.outputs.version }}"
          PACKAGES=(
            "com.reactor.java-rust-glowroot-parent"
            "com.reactor.java-rust-glowroot-agent"
            "com.reactor.java-rust-glowroot-spring-runtime"
            "com.reactor.java-rust-glowroot-spring-mvc-adapter"
            "com.reactor.java-rust-glowroot-spring-tomcat-adapter"
            "com.reactor.java-rust-glowroot-spring-jetty-adapter"
            "com.reactor.java-rust-glowroot-spring-undertow-adapter"
            "com.reactor.java-rust-glowroot-spring-boot-starter"
            "com.reactor.java-rust-glowroot-spring-webflux-adapter"
            "com.reactor.java-rust-glowroot-spring-dubbo-adapter"
          )
          for package in "${PACKAGES[@]}"; do
            API_PATH="/users/${GITHUB_REPOSITORY_OWNER}/packages/maven/${package}/versions"
            VERSION_ID="$(gh api --paginate "${API_PATH}?per_page=100" --jq ".[] | select(.name == \"${VERSION}\") | .id" 2>/dev/null | head -n 1 || true)"
            if [[ -n "$VERSION_ID" ]]; then
              gh api --method DELETE "${API_PATH}/${VERSION_ID}"
            fi
          done

      - name: Test and publish Maven packages
        run: >-
          mvn -B -ntp clean deploy
          -DretryFailedDeploymentCount=5
          -Daether.connector.basic.threads=1
          -Dmaven.wagon.http.retryHandler.count=5

      - name: Verify published Maven package versions
        shell: bash
        run: |
          VERSION="${{ steps.release_metadata.outputs.version }}"
          PACKAGES=(
            "com.reactor.java-rust-glowroot-parent"
            "com.reactor.java-rust-glowroot-agent"
            "com.reactor.java-rust-glowroot-spring-runtime"
            "com.reactor.java-rust-glowroot-spring-mvc-adapter"
            "com.reactor.java-rust-glowroot-spring-tomcat-adapter"
            "com.reactor.java-rust-glowroot-spring-jetty-adapter"
            "com.reactor.java-rust-glowroot-spring-undertow-adapter"
            "com.reactor.java-rust-glowroot-spring-boot-starter"
            "com.reactor.java-rust-glowroot-spring-webflux-adapter"
            "com.reactor.java-rust-glowroot-spring-dubbo-adapter"
          )
          for package in "${PACKAGES[@]}"; do
            API_PATH="/users/${GITHUB_REPOSITORY_OWNER}/packages/maven/${package}/versions"
            found=0
            for _ in $(seq 1 12); do
              if gh api --paginate "${API_PATH}?per_page=100" --jq ".[] | select(.name == \"${VERSION}\") | .name" | grep -qx "$VERSION"; then
                found=1
                break
              fi
              sleep 5
            done
            test "$found" = "1"
          done

      - name: Prepare release assets
        shell: bash
        run: |
          VERSION="${{ steps.release_metadata.outputs.version }}"
          mkdir -p release-assets
          MODULES=(
            "agent-bootstrap:java-rust-glowroot-agent"
            "spring-runtime-core:java-rust-glowroot-spring-runtime"
            "spring-mvc-adapter:java-rust-glowroot-spring-mvc-adapter"
            "spring-tomcat-adapter:java-rust-glowroot-spring-tomcat-adapter"
            "spring-jetty-adapter:java-rust-glowroot-spring-jetty-adapter"
            "spring-undertow-adapter:java-rust-glowroot-spring-undertow-adapter"
            "spring-boot-starter:java-rust-glowroot-spring-boot-starter"
            "spring-webflux-adapter:java-rust-glowroot-spring-webflux-adapter"
            "spring-dubbo-adapter:java-rust-glowroot-spring-dubbo-adapter"
          )
          for entry in "${MODULES[@]}"; do
            module="${entry%%:*}"
            artifact="${entry##*:}"
            for suffix in "" "-sources" "-javadoc"; do
              file="${module}/target/${artifact}-${VERSION}${suffix}.jar"
              test -s "$file"
              cp "$file" release-assets/
            done
          done
          cp spring-runtime-core/src/main/resources/native/windows-x64/rust_glowroot_agent.dll \
            release-assets/rust_glowroot_agent-windows-x64.dll
          cp spring-runtime-core/src/main/resources/native/linux-x64/librust_glowroot_agent.so \
            release-assets/librust_glowroot_agent-linux-x64.so
          cp spring-runtime-core/src/main/resources/native/native-provenance.properties \
            release-assets/native-provenance.properties
          SPRING_GATE_DIR="${RUNNER_TEMP}/java-rust-glowroot-spring-gate"
          REST_GATE_DIR="${RUNNER_TEMP}/java-rust-glowroot-rest-gate"
          cp "$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/REPORT.md' -type f -print -quit)" \
            release-assets/spring-boot-production-gate.md
          cp "$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/summary.json' -type f -print -quit)" \
            release-assets/spring-boot-production-gate-summary.json
          cp "$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/steady-memory.json' -type f -print -quit)" \
            release-assets/spring-boot-steady-memory.json
          cp "$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/warmup.json' -type f -print -quit)" \
            release-assets/spring-boot-warmup-stability.json
          cp "$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/invalid-pair-attempts.json' -type f -print -quit)" \
            release-assets/spring-boot-invalid-pair-attempts.json
          cp "$(find "$SPRING_GATE_DIR" -path '*/runner-preflight/spring-boot-agent.json' -type f -print -quit)" \
            release-assets/spring-boot-runner-preflight.json
          cp "$(find "$REST_GATE_DIR" -path '*/rest_gate_*/REPORT.md' -type f -print -quit)" \
            release-assets/rust-java-rest-production-gate.md
          cp "$(find "$REST_GATE_DIR" -path '*/rest_gate_*/summary.json' -type f -print -quit)" \
            release-assets/rust-java-rest-production-gate-summary.json
          cp "$(find "$REST_GATE_DIR" -path '*/rest_gate_*/steady-memory.json' -type f -print -quit)" \
            release-assets/rust-java-rest-steady-memory.json
          cp "$(find "$REST_GATE_DIR" -path '*/rest_gate_*/warmup.json' -type f -print -quit)" \
            release-assets/rust-java-rest-warmup-stability.json
          cp "$(find "$REST_GATE_DIR" -path '*/runner-preflight/rust-java-rest-agent.json' -type f -print -quit)" \
            release-assets/rust-java-rest-runner-preflight.json
          cp "$(find "$REST_GATE_DIR" -path '*/glowroot_gate_*/gate-summary.json' -type f -print -quit)" \
            release-assets/rust-java-rest-protocol-gate-summary.json
          cp "$(find "$REST_GATE_DIR" -name 'runtime-evidence-identity.json' -type f -print -quit)" \
            release-assets/rust-java-rest-runtime-evidence-identity.json
          (cd release-assets && sha256sum ./* > SHA256SUMS)

      - name: Create or update GitHub release
        shell: bash
        run: |
          VERSION="${{ steps.release_metadata.outputs.version }}"
          TAG="v${VERSION}"
          RELEASE_FLAGS=()
          IS_PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
            RELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "java-rust-glowroot-agent ${VERSION}" \
              --notes-file "${{ steps.release_metadata.outputs.notes }}" \
              --draft=false \
              --prerelease="$IS_PRERELEASE"
            gh release upload "$TAG" ./release-assets/* --clobber
          else
            gh release create "$TAG" ./release-assets/* \
              --title "java-rust-glowroot-agent ${VERSION}" \
              --notes-file "${{ steps.release_metadata.outputs.notes }}" \
              --verify-tag \
              "${RELEASE_FLAGS[@]}"
          fi
