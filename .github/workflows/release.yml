name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.3.0"
        required: true
        type: string
      repair_partial_package:
        description: "Delete and republish incomplete GitHub Packages versions"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve release version
        id: requested_version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check out the requested release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          git fetch --force --tags
          git checkout --detach "v${{ steps.requested_version.outputs.version }}"

      - name: Set up Semeru OpenJ9 21 and Maven publishing
        uses: actions/setup-java@v5
        with:
          distribution: semeru
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify tag and release notes
        id: release_metadata
        shell: bash
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test "${VERSION}" = "${{ steps.requested_version.outputs.version }}"
          NOTES="docs/releases/${VERSION}.md"
          test -f "$NOTES"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Verify the exact release commit passed the production gate
        id: production_gate
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          RUN_ID="$(gh run list \
            --workflow production-gate.yml \
            --commit "$SHA" \
            --status success \
            --limit 1 \
            --json databaseId,headSha,conclusion \
            --jq ".[] | select(.headSha == \"${SHA}\" and .conclusion == \"success\") | .databaseId" \
            | head -n 1)"
          if [[ -z "$RUN_ID" ]]; then
            echo "No successful Production Gate exists for release commit $SHA" >&2
            exit 1
          fi
          echo "Production Gate run $RUN_ID passed for $SHA"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Verify native provenance and production evidence
        shell: bash
        run: |
          MANIFEST="spring-boot-starter/src/main/resources/native/native-provenance.properties"
          grep -qx 'schema=1' "$MANIFEST"
          grep -qx 'glowroot.abi=3' "$MANIFEST"
          grep -Eq '^source.revision=[0-9a-f]{40}$' "$MANIFEST"
          if grep -q -- '-dirty$' "$MANIFEST"; then
            echo "Dirty native provenance cannot be released" >&2
            exit 1
          fi
          WINDOWS_EXPECTED="$(sed -n 's/^windows-x64.sha256=//p' "$MANIFEST")"
          LINUX_EXPECTED="$(sed -n 's/^linux-x64.sha256=//p' "$MANIFEST")"
          test "$(sha256sum spring-boot-starter/src/main/resources/native/windows-x64/rust_glowroot_agent.dll | awk '{print $1}')" = "$WINDOWS_EXPECTED"
          test "$(sha256sum spring-boot-starter/src/main/resources/native/linux-x64/librust_glowroot_agent.so | awk '{print $1}')" = "$LINUX_EXPECTED"

          SPRING_GATE_DIR="${RUNNER_TEMP}/java-rust-glowroot-spring-gate"
          REST_GATE_DIR="${RUNNER_TEMP}/java-rust-glowroot-rest-gate"
          mkdir -p "$SPRING_GATE_DIR" "$REST_GATE_DIR"
          gh run download "${{ steps.production_gate.outputs.run_id }}" \
            --name spring-boot-production-gate \
            --dir "$SPRING_GATE_DIR"
          gh run download "${{ steps.production_gate.outputs.run_id }}" \
            --name rust-java-rest-production-gate \
            --dir "$REST_GATE_DIR"

          SPRING_REPORT="$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/REPORT.md' -type f -print -quit)"
          SPRING_SUMMARY="$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/summary.json' -type f -print -quit)"
          SPRING_STEADY="$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/steady-memory.json' -type f -print -quit)"
          SPRING_WARMUP="$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/warmup.json' -type f -print -quit)"
          REST_REPORT="$(find "$REST_GATE_DIR" -path '*/rest_gate_*/REPORT.md' -type f -print -quit)"
          REST_SUMMARY="$(find "$REST_GATE_DIR" -path '*/rest_gate_*/summary.json' -type f -print -quit)"
          REST_STEADY="$(find "$REST_GATE_DIR" -path '*/rest_gate_*/steady-memory.json' -type f -print -quit)"
          REST_WARMUP="$(find "$REST_GATE_DIR" -path '*/rest_gate_*/warmup.json' -type f -print -quit)"
          REST_PROTOCOL_REPORT="$(find "$REST_GATE_DIR" -path '*/glowroot_gate_*/REPORT.md' -type f -print -quit)"
          REST_PROTOCOL_SUMMARY="$(find "$REST_GATE_DIR" -path '*/glowroot_gate_*/gate-summary.json' -type f -print -quit)"
          for FILE in "$SPRING_REPORT" "$SPRING_SUMMARY" "$SPRING_STEADY" "$SPRING_WARMUP" \
            "$REST_REPORT" "$REST_SUMMARY" "$REST_STEADY" "$REST_WARMUP" \
            "$REST_PROTOCOL_REPORT" "$REST_PROTOCOL_SUMMARY"; do
            test -s "$FILE"
          done
          jq -e '.passed == true and .application_kind == "spring-boot" and
            .pair_repeats >= 6 and
            .non_2xx_decision == "endpoint_noninferiority_median_weighted_aggregate_and_peak_envelope" and
            .non_2xx_threshold_percentage_points == 0 and
            .saturated_non_2xx_threshold_percentage_points == 0.02 and
            .absolute_non_2xx_ceiling_percent == 0.05 and
            .warmup_stability.fixed_rounds == 14 and
            .warmup_stability.interleaved_primer_rounds == 4 and
            .warmup_stability.endpoint_stability_rounds == 10 and
            .warmup_stability.stability_window_rounds == 3 and
            .warmup_stability.maximum_allowed_median_shift_pct == 3 and
            .warmup_stability.maximum_allowed_median_absolute_deviation_pct == 4 and
            .warmup_stability.gate == "PASS" and
            .steady_memory.gate == "PASS" and
            (.rows | length) == 6 and all(.rows[]; .gate == "PASS" and
              .non_2xx_delta_pp <= .non_2xx_delta_threshold_pp and
              .aggregate_non_2xx_delta_pp <= .non_2xx_delta_threshold_pp and
              (.candidate_peak_non_2xx_pct - .baseline_peak_non_2xx_pct) <= .non_2xx_delta_threshold_pp and
              .baseline_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .candidate_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .baseline_peak_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .candidate_peak_non_2xx_pct <= .absolute_non_2xx_ceiling_pct)' \
            "$SPRING_SUMMARY" >/dev/null
          jq -e '.passed == true and .application_kind == "rust-java-rest" and
            .required_rest_version == "4.5.0" and .required_rest_native_abi == 29 and
            .activation_mode == "embedded_native_properties" and .pair_repeats >= 6 and
            .non_2xx_decision == "endpoint_noninferiority_median_weighted_aggregate_and_peak_envelope" and
            .non_2xx_threshold_percentage_points == 0 and
            .saturated_non_2xx_threshold_percentage_points == 0.02 and
            .absolute_non_2xx_ceiling_percent == 0.05 and
            .warmup_stability.fixed_rounds == 14 and
            .warmup_stability.interleaved_primer_rounds == 4 and
            .warmup_stability.endpoint_stability_rounds == 10 and
            .warmup_stability.stability_window_rounds == 3 and
            .warmup_stability.maximum_allowed_median_shift_pct == 3 and
            .warmup_stability.maximum_allowed_median_absolute_deviation_pct == 4 and
            .warmup_stability.gate == "PASS" and .steady_memory.gate == "PASS" and
            (.rows | length) == 6 and
            all(.rows[]; .gate == "PASS" and
              .non_2xx_delta_pp <= .non_2xx_delta_threshold_pp and
              .aggregate_non_2xx_delta_pp <= .non_2xx_delta_threshold_pp and
              (.candidate_peak_non_2xx_pct - .baseline_peak_non_2xx_pct) <= .non_2xx_delta_threshold_pp and
              .baseline_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .candidate_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .baseline_peak_non_2xx_pct <= .absolute_non_2xx_ceiling_pct and
              .candidate_peak_non_2xx_pct <= .absolute_non_2xx_ceiling_pct)' \
            "$REST_SUMMARY" >/dev/null
          jq -e '.passed == true and .protocol_gate == "PASS" and
            .fail_open_gate == "PASS" and .javaagent_bootstrap_gate == "PASS"' \
            "$REST_PROTOCOL_SUMMARY" >/dev/null

      - name: Remove incomplete Maven package versions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_partial_package }}
        shell: bash
        run: |
          VERSION="${{ steps.release_metadata.outputs.version }}"
          PACKAGES=(
            "com.reactor.java-rust-glowroot-parent"
            "com.reactor.java-rust-glowroot-agent"
            "com.reactor.java-rust-glowroot-spring-boot-starter"
          )
          for package in "${PACKAGES[@]}"; do
            API_PATH="/users/${GITHUB_REPOSITORY_OWNER}/packages/maven/${package}/versions"
            VERSION_ID="$(gh api --paginate "${API_PATH}?per_page=100" --jq ".[] | select(.name == \"${VERSION}\") | .id" 2>/dev/null | head -n 1 || true)"
            if [[ -n "${VERSION_ID}" ]]; then
              gh api --method DELETE "${API_PATH}/${VERSION_ID}"
            fi
          done
          for _ in $(seq 1 12); do
            remaining=0
            for package in "${PACKAGES[@]}"; do
              API_PATH="/users/${GITHUB_REPOSITORY_OWNER}/packages/maven/${package}/versions"
              if gh api --paginate "${API_PATH}?per_page=100" --jq ".[] | select(.name == \"${VERSION}\") | .id" | grep -q .; then
                remaining=1
              fi
            done
            if [[ "$remaining" == "0" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "One or more package versions were not deleted in time" >&2
          exit 1

      - name: Test and publish Maven package
        run: >-
          mvn -B -ntp clean deploy
          -DretryFailedDeploymentCount=5
          -Daether.connector.basic.threads=1
          -Dmaven.wagon.http.retryHandler.count=5

      - name: Verify published Maven package versions
        shell: bash
        run: |
          VERSION="${{ steps.release_metadata.outputs.version }}"
          for package in \
            "com.reactor.java-rust-glowroot-parent" \
            "com.reactor.java-rust-glowroot-agent" \
            "com.reactor.java-rust-glowroot-spring-boot-starter"; do
            API_PATH="/users/${GITHUB_REPOSITORY_OWNER}/packages/maven/${package}/versions"
            found=0
            for _ in $(seq 1 12); do
              if gh api --paginate "${API_PATH}?per_page=100" --jq ".[] | select(.name == \"${VERSION}\") | .name" | grep -qx "$VERSION"; then
                found=1
                break
              fi
              sleep 5
            done
            test "$found" = "1"
          done

      - name: Prepare and verify release assets
        shell: bash
        run: |
          VERSION="${{ steps.release_metadata.outputs.version }}"
          mkdir -p release-assets
          for FILE in \
            "agent-bootstrap/target/java-rust-glowroot-agent-${VERSION}.jar" \
            "agent-bootstrap/target/java-rust-glowroot-agent-${VERSION}-sources.jar" \
            "agent-bootstrap/target/java-rust-glowroot-agent-${VERSION}-javadoc.jar" \
            "spring-boot-starter/target/java-rust-glowroot-spring-boot-starter-${VERSION}.jar" \
            "spring-boot-starter/target/java-rust-glowroot-spring-boot-starter-${VERSION}-sources.jar" \
            "spring-boot-starter/target/java-rust-glowroot-spring-boot-starter-${VERSION}-javadoc.jar"; do
            test -s "$FILE"
            cp "$FILE" release-assets/
          done
          cp spring-boot-starter/src/main/resources/native/windows-x64/rust_glowroot_agent.dll \
            release-assets/rust_glowroot_agent-windows-x64.dll
          cp spring-boot-starter/src/main/resources/native/linux-x64/librust_glowroot_agent.so \
            release-assets/librust_glowroot_agent-linux-x64.so
          SPRING_GATE_DIR="${RUNNER_TEMP}/java-rust-glowroot-spring-gate"
          REST_GATE_DIR="${RUNNER_TEMP}/java-rust-glowroot-rest-gate"
          cp "$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/REPORT.md' -type f -print -quit)" \
            release-assets/spring-boot-production-gate.md
          cp "$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/summary.json' -type f -print -quit)" \
            release-assets/spring-boot-production-gate-summary.json
          cp "$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/steady-memory.json' -type f -print -quit)" \
            release-assets/spring-boot-steady-memory.json
          cp "$(find "$SPRING_GATE_DIR" -path '*/spring_gate_*/warmup.json' -type f -print -quit)" \
            release-assets/spring-boot-warmup-stability.json
          cp "$(find "$REST_GATE_DIR" -path '*/rest_gate_*/REPORT.md' -type f -print -quit)" \
            release-assets/rust-java-rest-production-gate.md
          cp "$(find "$REST_GATE_DIR" -path '*/rest_gate_*/summary.json' -type f -print -quit)" \
            release-assets/rust-java-rest-production-gate-summary.json
          cp "$(find "$REST_GATE_DIR" -path '*/rest_gate_*/steady-memory.json' -type f -print -quit)" \
            release-assets/rust-java-rest-steady-memory.json
          cp "$(find "$REST_GATE_DIR" -path '*/rest_gate_*/warmup.json' -type f -print -quit)" \
            release-assets/rust-java-rest-warmup-stability.json
          cp "$(find "$REST_GATE_DIR" -path '*/glowroot_gate_*/gate-summary.json' -type f -print -quit)" \
            release-assets/rust-java-rest-protocol-gate-summary.json
          (cd release-assets && sha256sum ./* > SHA256SUMS)

      - name: Create or update GitHub release
        shell: bash
        run: |
          VERSION="${{ steps.release_metadata.outputs.version }}"
          TAG="v${VERSION}"
          ASSETS=(./release-assets/*)
          RELEASE_FLAGS=()
          IS_PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
            RELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "java-rust-glowroot-agent ${VERSION}" \
              --notes-file "${{ steps.release_metadata.outputs.notes }}" \
              --draft=false \
              --prerelease="$IS_PRERELEASE"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "java-rust-glowroot-agent ${VERSION}" \
              --notes-file "${{ steps.release_metadata.outputs.notes }}" \
              --verify-tag \
              "${RELEASE_FLAGS[@]}"
          fi
