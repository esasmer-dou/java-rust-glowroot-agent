name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Semeru OpenJ9 21
        uses: actions/setup-java@v5
        with:
          distribution: semeru
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Enforce the bootstrap dependency boundary
        shell: bash
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAR="target/java-rust-glowroot-agent-${VERSION}.jar"
          test "$(jdeps --print-module-deps "$JAR")" = "java.base"
          test "$(jar tf "$JAR" | grep -c '^com/.*\.class$')" = "1"
