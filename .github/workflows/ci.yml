name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Semeru OpenJ9 21
        uses: actions/setup-java@v5
        with:
          distribution: semeru
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Verify plain JVM bootstrap without Spring
        shell: bash
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAR="agent-bootstrap/target/java-rust-glowroot-agent-${VERSION}.jar"
          mkdir -p target/plain-smoke
          cat > target/plain-smoke/PlainMain.java <<'EOF'
          public final class PlainMain {
              public static void main(String[] args) {
                  System.out.println(System.getProperty("reactor.glowroot.enabled", "missing"));
              }
          }
          EOF
          javac -d target/plain-smoke target/plain-smoke/PlainMain.java
          test "$(java -javaagent:"$JAR"=spring-enabled=false -cp target/plain-smoke PlainMain)" = "true"

      - name: Enforce bounded artifact surface
        shell: bash
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAR="agent-bootstrap/target/java-rust-glowroot-agent-${VERSION}.jar"
          STARTER="spring-boot-starter/target/java-rust-glowroot-spring-boot-starter-${VERSION}.jar"
          RUNTIME="spring-runtime-core/target/java-rust-glowroot-spring-runtime-${VERSION}.jar"
          test "$(jar tf "$JAR" | grep -c '^com/reactor/glowroot/agent/.*\.class$')" = "1"
          test "$(jar tf "$JAR" | grep -c '^native/')" = "0"
          ! jar tf "$STARTER" | grep -q '^native/'
          test "$(jar tf "$RUNTIME" | grep -c '^native/native-provenance.properties$')" = "1"
          test "$(jar tf "$RUNTIME" | grep -c '^native/windows-x64/rust_glowroot_agent.dll$')" = "1"
          test "$(jar tf "$RUNTIME" | grep -c '^native/linux-x64/librust_glowroot_agent.so$')" = "1"

      - name: Verify native provenance
        shell: bash
        run: |
          MANIFEST="spring-runtime-core/src/main/resources/native/native-provenance.properties"
          grep -qx 'schema=1' "$MANIFEST"
          grep -qx 'glowroot.abi=3' "$MANIFEST"
          grep -Eq '^source.revision=[0-9a-f]{40}$' "$MANIFEST"
          WINDOWS_EXPECTED="$(sed -n 's/^windows-x64.sha256=//p' "$MANIFEST")"
          LINUX_EXPECTED="$(sed -n 's/^linux-x64.sha256=//p' "$MANIFEST")"
          test "$(sha256sum spring-runtime-core/src/main/resources/native/windows-x64/rust_glowroot_agent.dll | awk '{print $1}')" = "$WINDOWS_EXPECTED"
          test "$(sha256sum spring-runtime-core/src/main/resources/native/linux-x64/librust_glowroot_agent.so | awk '{print $1}')" = "$LINUX_EXPECTED"
