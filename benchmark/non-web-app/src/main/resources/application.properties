spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN

reactor.glowroot.enabled=true
reactor.glowroot.profile=full
reactor.glowroot.collector.address=http://127.0.0.1:1
reactor.glowroot.agent.id=non-web-gate::worker
reactor.glowroot.application.name=non-web-gate
reactor.glowroot.hostname=localhost
reactor.glowroot.connect-timeout-ms=100
reactor.glowroot.request-timeout-ms=100
reactor.glowroot.http.sample-rate=256
reactor.glowroot.trace.capacity=0
reactor.glowroot.max-routes=1
reactor.glowroot.max-export-bytes=16384
